<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get Involved | Together for Her</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="top-banner">
        "One pad for one girl" — Support Menstrual Hygiene Equity Today!
    </div>

    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="brand">
                <img src="images/logo.png" alt="Together for Her Logo" class="nav-logo">
                <span class="brand-text">Together <i>for Her</i></span>
            </a>
            
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="team.html">Our Team</a></li>
                <li><a href="impact.html">Impact and Initiatives</a></li>
                <li><a href="contact.html" class="active">Get Involved</a></li>
            </ul>

            <a href="contact.html" class="btn-gradient">Donate / Join</a>
        </div>
    </nav>

    <section class="hero-section">
        <div class="hero-container" style="grid-template-columns: 1fr; max-width: 600px; margin: 0 auto;">
            <div class="featured-card">
                <h1 class="hero-title" style="font-size: 2rem; margin-bottom: 12px;">Get Involved</h1>
                <p class="card-text">
                    If you'd like to join our team, donate, or share an idea, send us a message below. We read every inquiry!
                </p>

                <form action="https://formspree.io/f/YOUR_FORM_ID" method="POST" style="display: flex; flex-direction: column; gap: 16px;">
                    <div>
                        <label style="display: block; font-size: 0.85rem; color: #94a3b8; margin-bottom: 6px;">Your Name</label>
                        <input type="text" name="name" placeholder="Enter your name" required style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); background: #0b0c10; color: #fff;">
                    </div>
                    <div>
                        <label style="display: block; font-size: 0.85rem; color: #94a3b8; margin-bottom: 6px;">Your Email</label>
                        <input type="email" name="email" placeholder="Enter your email" required style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); background: #0b0c10; color: #fff;">
                    </div>
                    <div>
                        <label style="display: block; font-size: 0.85rem; color: #94a3b8; margin-bottom: 6px;">Your Message</label>
                        <textarea name="message" rows="5" placeholder="Write your message..." required style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); background: #0b0c10; color: #fff;"></textarea>
                    </div>
                    <button type="submit" class="btn-gradient" style="border: none; cursor: pointer; width: 100%; margin-top: 8px;">Send Message</button>
                </form>
            </div>
        </div>
    </section>

    <script src="js/main.js"></script>
</body>
</html>
