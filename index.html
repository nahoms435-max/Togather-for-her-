<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToGather For Her - Get Involved</title>
    <style>
        /* Base Styling */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #090a0f;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Container & Form Wrapper Styling */
        .form-container {
            width: 100%;
            max-width: 480px;
            background-color: #0f111a;
            border: 1px solid rgba(236, 72, 153, 0.2);
            border-radius: 16px;
            padding: 32px 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            margin: 0 auto;
        }

        .form-header {
            text-align: center;
            margin-bottom: 24px;
        }

        .form-header h2 {
            font-size: 1.75rem;
            color: #ffffff;
            margin-bottom: 8px;
        }

        .form-header p {
            color: #94a3b8;
            font-size: 0.95rem;
            line-height: 1.4;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        form div {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            color: #94a3b8;
            font-size: 0.95rem;
            font-weight: 500;
        }

        input[type="text"],
        input[type="email"],
        textarea {
            width: 100%;
            background-color: #1a1d2d;
            border: 1px solid #2e344d;
            border-radius: 8px;
            padding: 12px 16px;
            color: #ffffff;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
            font-family: inherit;
        }

        input[type="text"]:focus,
        input[type="email"]:focus,
        textarea:focus {
            border-color: #a855f7;
            box-shadow: 0 0 0 3px rgba(168, 85, 247, 0.2);
        }

        textarea {
            resize: vertical;
        }

        /* Submit Button Styling */
        .submit-btn {
            width: 100%;
            background: linear-gradient(90deg, #ec4899 0%, #8b5cf6 100%);
            color: #ffffff;
            font-weight: 600;
            font-size: 1rem;
            padding: 14px;
            border: none;
            border-radius: 9999px;
            cursor: pointer;
            transition: opacity 0.2s ease, transform 0.1s ease;
            box-shadow: 0 4px 15px rgba(236, 72, 153, 0.3);
            margin-top: 6px;
        }

        .submit-btn:hover {
            opacity: 0.92;
        }

        .submit-btn:active {
            transform: scale(0.98);
        }

        /* Success & Error Message Styling */
        .status-message {
            margin-top: 12px;
            padding: 12px 16px;
            border-radius: 8px;
            text-align: center;
            font-size: 0.95rem;
            font-weight: 500;
            animation: fadeIn 0.3s ease-in-out;
        }

        .status-message.success {
            color: #4ade80;
            background-color: rgba(74, 222, 128, 0.1);
            border: 1px solid rgba(74, 222, 128, 0.25);
        }

        .status-message.error {
            color: #f87171;
            background-color: rgba(248, 113, 113, 0.1);
            border: 1px solid rgba(248, 113, 113, 0.25);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(6px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>

    <div class="form-container">
        <div class="form-header">
            <h2>Get Involved</h2>
            <p>If you'd like to join our team, donate, or share an idea, send us an email below. We read every message!</p>
        </div>

        <form action="/contact" method="POST">
            <div>
                <label for="name">Your Name</label>
                <input type="text" id="name" name="name" required placeholder="Enter your name">
            </div>

            <div>
                <label for="email">Your Email</label>
                <input type="email" id="email" name="email" required placeholder="Enter your email">
            </div>

            <div>
                <label for="message">Your Message</label>
                <textarea id="message" name="message" rows="5" required placeholder="Write your message..."></textarea>
            </div>

            <button type="submit" class="submit-btn">Send Us an Email</button>

            <!-- FLASHED SUCCESS / ERROR MESSAGE BELOW BUTTON -->
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="status-message {{ category }}">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}
        </form>
    </div>

</body>
</html>
