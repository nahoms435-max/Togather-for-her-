<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Together for Her is a youth-led initiative in Ethiopia empowering girls and women facing difficult circumstances, obstetric fistula, and social stigma.">
    <meta name="keywords" content="Together for Her, Ethiopia youth initiative, women empowerment Ethiopia, obstetric fistula advocacy">
    
    <!-- Google Search Console Verification Tag -->
    <meta name="google-site-verification" content="YOUR_ACTUAL_VERIFICATION_CODE_HERE" />

    <title>Together for Her</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Intro Overlay Animation -->
    <div id="intro-overlay">
        <div id="counter-screen">
            <span id="counter">0</span><span class="percent">%</span>
        </div>
        <div id="flash-layer"></div>
        <div id="words-container">
            <h1 class="statement-word">Together for Her</h1>
        </div>
    </div>

    <!-- Main Website Content -->
    <header class="hero">
        <div class="hero-brand-container">
            <img src="images/logo.png" alt="Together for Her Logo" class="main-logo">
            <span class="hero-tagline">Empowering Girls & Women in Ethiopia</span>
        </div>
        <nav>
            <button class="menu-btn">Menu</button>
        </nav>
    </header>

    <!-- GSAP Animation Library CDN (Required for counter and overlay transitions) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    
    <!-- Main Custom JavaScript -->
    <script src="js/main.js"></script>
</body>
</html>
