<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Together for Her is a youth-led initiative in Ethiopia empowering girls and women.">
    
    <!-- Google Search Console Verification Tag -->
    <meta name="google-site-verification" content="YOUR_ACTUAL_VERIFICATION_CODE_HERE" />

    <title>Together for Her</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Intro Overlay -->
    <div id="intro-overlay">
        <div id="counter-screen">
            <span id="counter">0</span><span class="percent">%</span>
        </div>
        <div id="flash-layer"></div>
        <div id="words-container">
            <h1 class="statement-word">Together for Her</h1>
        </div>
    </div>

    <!-- Main Website Content -->
    <main id="main-content">
        <header class="hero">
            <div class="hero-brand-container">
                <img src="images/logo.png" alt="Together for Her Logo" class="main-logo">
                <h1 class="hero-title">Together for Her</h1>
                <p class="hero-tagline">Empowering Girls & Women in Ethiopia</p>
            </div>
            <nav>
                <button class="menu-btn">Menu</button>
            </nav>
        </header>

        <section class="about-section">
            <h2>About Our Initiative</h2>
            <p>Dedicated to supporting and empowering young women across Ethiopia through education, advocacy, and community outreach.</p>
        </section>
    </main>

    <!-- GSAP Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <!-- Custom JavaScript -->
    <script src="js/main.js"></script>
</body>
</html>
