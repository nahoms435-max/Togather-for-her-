<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meet the Team | Together for Her</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="/" class="nav-logo">
                <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Together for Her Logo">
            </a>
            <ul class="nav-links">
                <li><a href="/">Home</a></li>
                <li><a href="/impact">Impact</a></li>
                <li><a href="/team" class="active">Team</a></li>
                <li><a href="/contact">Get Involved</a></li>
            </ul>
        </div>
    </nav>

    <!-- TEAM CONTENT -->
    <main class="page-container">
        <header class="page-header">
            <h1>Our Leadership Team</h1>
            <p>Meet the co-founders leading the initiative for menstrual health equity.</p>
        </header>

        <section class="team-grid">
            <div class="team-card">
                <img src="{{ url_for('static', filename='images/member1.jpg') }}" alt="Co-Founder Member 1" class="member-img">
                <h3>Co-Founder</h3>
                <p>Co-Founder & Director</p>
            </div>
            <div class="team-card">
                <img src="{{ url_for('static', filename='images/member2.jpg') }}" alt="Co-Founder Member 2" class="member-img">
                <h3>Co-Founder</h3>
                <p>Co-Founder & Outreach Lead</p>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Together for Her. All rights reserved.</p>
    </footer>

</body>
</html>
